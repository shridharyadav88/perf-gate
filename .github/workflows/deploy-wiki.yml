name: Deploy OpenWiki to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "openwiki/**"
      - "scripts/build-wiki-site.mjs"
      - ".github/workflows/deploy-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.3.1

      - name: Build static wiki site
        run: node scripts/build-wiki-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e14203612a9e19a5000ea9b906a5ae16 # v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db9015920f08890bd3831492f0a177517ed7a9 # v4
