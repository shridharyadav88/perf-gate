# Dogfood: this repo's own PRs are gated by pr_gate.py (diff-scoped,
# baseline-vs-branch on touched functions only). Infra hiccups SKIP with
# exit 0; only measured, introduced regressions fail the build.
name: perf-gate

on:
  pull_request:

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (Big-O / line-profiler deps for the scan)
        run: pip install -e .[dev]
      - name: Gate touched functions vs base
        run: |
          python3 src/project_code_optimization/skills/code-optimizer/scripts/pr_gate.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --timeout 30 --stage-timeout 600
