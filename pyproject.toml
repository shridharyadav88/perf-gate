[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-gate"
version = "0.1.0"
description = "Deterministic pre-merge Python performance gate: profile touched functions, fail PRs on measured regressions, propose mechanical fixes."
readme = "README.md"
license = "MIT"
authors = [
    {name = "Enterprise Engineering", email = "engineering@example.com"},
]
requires-python = ">=3.9"
dependencies = [
    "big-O>=0.10.0,<0.12",
    "line-profiler>=4.1.0,<6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["agent-skills", "profiling", "big-o", "line-profiler", "optimization", "code-quality"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/shridharyadav88/perf-gate"
Repository = "https://github.com/shridharyadav88/perf-gate"

[project.scripts]
install-agent-skills = "perf_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["perf_gate*"]

[tool.setuptools.package-data]
"perf_gate" = ["skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
